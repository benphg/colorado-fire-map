# Builds the map data on GitHub's servers and publishes the site to GitHub Pages.
# Runs on every push, on demand (Actions tab -> "Run workflow"), and monthly to pick up new data.
name: Build and publish map

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: "17 9 1 * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download precipitation + fire data
        run: python run.py --no-serve
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
